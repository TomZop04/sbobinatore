[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sbobinatore"
version = "0.1.0"
description = "Local lecture transcription tool"
requires-python = ">=3.11"

[project.scripts]
sbobinatore = "sbobinatore.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
